name: pages

# Publishes the dashboard. The site is deliberately static: it reads committed
# run checkpoints, so the deployed page and `make replay` render the same
# artifact and neither needs a secret. Any credential (Stripe restricted key,
# Terac key) stays server-side and only ever writes runs/ledger.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assemble site
        # One assembly path for all three publishing workflows.
        run: python3 scripts/build_site.py --out _site --run-id demo

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4